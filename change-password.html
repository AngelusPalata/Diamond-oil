<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - Diamond Oil</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="auth-box">
      <div class="top-row">
        <div class="brand">Diamond Oil</div>
        <div class="auth-lang-switch" aria-label="Language switcher">
          <button type="button" class="lang-btn active" data-auth-lang="fr">FR</button>
          <button type="button" class="lang-btn" data-auth-lang="en">EN</button>
        </div>
      </div>

      <h1 id="change-password-title">Changer le mot de passe</h1>
      <p id="change-password-subtitle" class="subtitle">Choisissez un nouveau mot de passe pour sécuriser votre compte.</p>

      <form id="change-password-form">
        <div class="form-row">
          <label id="new-password-label" for="new-password">Nouveau mot de passe</label>
          <div class="password-stack">
            <input id="new-password" name="newPassword" type="password" minlength="6" required />
            <button
              type="button"
              class="toggle-password"
              data-toggle-password="new-password"
              aria-label="Afficher le mot de passe"
              aria-pressed="false"
            >
              👁
            </button>
          </div>
        </div>

        <div class="form-row">
          <label id="confirm-password-label" for="confirm-password">Confirmer le mot de passe</label>
          <div class="password-stack">
            <input id="confirm-password" name="confirmPassword" type="password" minlength="6" required />
            <button
              type="button"
              class="toggle-password"
              data-toggle-password="confirm-password"
              aria-label="Afficher le mot de passe"
              aria-pressed="false"
            >
              👁
            </button>
          </div>
        </div>

        <button id="save-password-button" type="submit">Enregistrer le nouveau mot de passe</button>
        <div id="change-password-message" class="notice" aria-live="polite"></div>
      </form>
    </main>

    <script src="seller-translations.js"></script>
    <script src="change-password.js"></script>
  </body>
</html>
